appId: me.limboy.crow
productName: Crow
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!out/quicklook/**'
  - '!src/*'
  - '!cli/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.*.json,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asar: true
# The standalone CLI ships as a real file outside the asar archive (not via
# `files`) so "Install 'crow' Command in PATH" (src/main/cli.ts) can point a
# plain shell wrapper straight at it — no unpacking or asar-aware fs needed.
extraResources:
  - from: cli/crow.mjs
    to: cli/crow.mjs
# Makes Crow the app that opens .crow documents. A document is a directory
# (data.json plus its media folders); `isPackage` and the exported type below
# make Finder show and open it as a single file. macOS delivers opened
# documents through app 'open-file' — see src/main/index.ts.
fileAssociations:
  - ext: crow
    name: Crow Document
    description: Crow Document
    role: Editor
    isPackage: true
    # build/document.icns — the app artwork as a rounded icon; regenerate with
    # `swift macos/make-document-icon.swift`.
    icon: document
# GitHub is the update feed for electron-updater (added later): each publish
# uploads latest-mac.yml alongside the zip, which is what autoUpdater polls.
publish:
  provider: github
  owner: limboy
  repo: crow
  # Release publishes immediately when CI succeeds — no manual "Publish release"
  # click. A passing build (incl. signing/notarization) goes live automatically.
  releaseType: release
mac:
  target:
    # zip is required by electron-updater's Squirrel.Mac; dmg is for manual installs.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.icns
  # Quick Look preview and thumbnail for .crow documents (macos/quicklook),
  # built by `npm run build:quicklook`. macos/sign.cjs signs them before the app.
  extraFiles:
    - from: out/quicklook/CrowQuickLook.appex
      to: PlugIns/CrowQuickLook.appex
    - from: out/quicklook/CrowThumbnail.appex
      to: PlugIns/CrowThumbnail.appex
  sign: macos/sign.cjs
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: me.limboy.crow.document
        UTTypeDescription: Crow Document
        UTTypeIconFile: document.icns
        UTTypeConformsTo:
          - com.apple.package
          - public.composite-content
        UTTypeTagSpecification:
          public.filename-extension:
            - crow
dmg:
  artifactName: ${name}-${version}.${ext}
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
