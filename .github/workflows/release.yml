name: Release

# Fires when a version tag is pushed (npm version creates tags like v0.2.0),
# or manually from the Actions tab for a rebuild without cutting a new version.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create/attach assets to a GitHub release

jobs:
  mac-arm64:
    # macos-14+ GitHub-hosted runners are Apple Silicon, matching the --arm64 target below.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # electron-builder's mac target list (dmg + zip) each try to get-or-create the
      # GitHub release for this tag when publishing, and those two calls can race —
      # both see "no release yet" and each create one, leaving two releases for the
      # same tag with the assets split between them. Pre-creating it here means
      # electron-builder always finds it already existing and just uploads to it,
      # so there's nothing left to race over.
      #
      # Created directly as public (no --draft) to match publish.releaseType: release
      # in electron-builder.yml — electron-builder reuses whatever release it finds
      # by tag as-is, draft or not, so if this created a draft the build would land
      # as a draft forever regardless of that release-type setting.
      #
      # --generate-notes has GitHub build the release body from the commits (and any
      # PRs) since the previous release tag, so there's no separate changelog to
      # maintain by hand.
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${tag#v}" --generate-notes
          fi

      - name: Build and publish (macOS, Apple Silicon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: base64-encoded "Developer ID Application" .p12 + its export password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization: electron-builder notarizes automatically once these three are set
          # (see app-builder-lib's MacTargetHelper.getNotarizeOptions) — no extra config needed.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish always
